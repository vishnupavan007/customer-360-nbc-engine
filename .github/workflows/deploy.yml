name: Deploy Customer 360 to Snowflake

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/**'
      - 'pipeline/**'
      - 'serving/**'
      - 'ops/**'
      - 'app/**'
  workflow_dispatch:

jobs:
  deploy-pipeline:
    name: SQL Pipeline
    runs-on: ubuntu-latest

    env:
      SNOWFLAKE_ACCOUNT:   ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER:      ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD:  ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE:      ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install snowflake-connector-python python-dotenv snowflake-snowpark-python

      - name: Grant Cortex AI privileges (idempotent)
        run: |
          python - <<'EOF'
          import os, snowflake.connector
          conn = snowflake.connector.connect(
              account=os.environ["SNOWFLAKE_ACCOUNT"],
              user=os.environ["SNOWFLAKE_USER"],
              password=os.environ["SNOWFLAKE_PASSWORD"],
              role="ACCOUNTADMIN",
              warehouse=os.environ["SNOWFLAKE_WAREHOUSE"],
          )
          cur = conn.cursor()
          try:
              cur.execute("GRANT DATABASE ROLE SNOWFLAKE.CORTEX_USER TO ROLE ACCOUNTADMIN")
          except Exception as e:
              print(f"Note: {e}")
          try:
              cur.execute("GRANT USE AI FUNCTIONS ON ACCOUNT TO ROLE ACCOUNTADMIN")
          except Exception as e:
              print(f"Note: {e}")
          conn.close()
          print("Cortex privileges granted.")
          EOF

      - name: Run SQL pipeline (files 00 through 09)
        run: python scripts/run_pipeline.py

      - name: Run document SQL files
        run: |
          python - <<'EOF'
          import os, snowflake.connector
          conn = snowflake.connector.connect(
              account=os.environ["SNOWFLAKE_ACCOUNT"],
              user=os.environ["SNOWFLAKE_USER"],
              password=os.environ["SNOWFLAKE_PASSWORD"],
              role="ACCOUNTADMIN",
              warehouse=os.environ["SNOWFLAKE_WAREHOUSE"],
              database="CUSTOMER_360",
          )
          cur = conn.cursor()
          for path in [
              "pipeline/data/02d_synthetic_documents.sql",
              "pipeline/documents/12_document_processing.sql",
          ]:
              print(f"Running {path}...")
              sql = open(path, encoding="utf-8").read()
              for stmt in sql.split(";"):
                  stmt = stmt.strip()
                  if stmt and not stmt.startswith("--"):
                      try:
                          cur.execute(stmt)
                      except Exception as e:
                          print(f"  WARN: {e}")
          conn.close()
          print("Document SQL complete.")
          EOF

  deploy-app:
    name: Streamlit App
    runs-on: ubuntu-latest
    needs: deploy-pipeline

    env:
      SNOWFLAKE_ACCOUNT:   ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER:      ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD:  ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE:      ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Snowflake CLI
        run: pip install snowflake-cli

      - name: Configure snow CLI connection
        run: |
          snow connection add \
            --connection-name default \
            --account "$SNOWFLAKE_ACCOUNT" \
            --user "$SNOWFLAKE_USER" \
            --role "$SNOWFLAKE_ROLE" \
            --warehouse "$SNOWFLAKE_WAREHOUSE" \
            --database CUSTOMER_360 \
            --schema APP \
            --no-interactive
          snow connection set-default default

      - name: Deploy Streamlit app
        working-directory: app
        run: snow streamlit deploy --replace
