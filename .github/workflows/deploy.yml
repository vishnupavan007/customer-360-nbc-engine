name: Deploy Customer 360 Streamlit App

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
  workflow_dispatch:

jobs:
  deploy-app:
    name: Streamlit App
    runs-on: ubuntu-latest

    env:
      SNOWFLAKE_ACCOUNT:   ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER:      ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD:  ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE:      ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Snowflake CLI
        run: pip install snowflake-cli snowflake-connector-python

      - name: Configure snow CLI connection
        run: |
          snow connection add \
            --connection-name default \
            --account "$SNOWFLAKE_ACCOUNT" \
            --user "$SNOWFLAKE_USER" \
            --role "$SNOWFLAKE_ROLE" \
            --warehouse "$SNOWFLAKE_WAREHOUSE" \
            --database CUSTOMER_360 \
            --schema APP \
            --no-interactive
          snow connection set-default default

      - name: Deploy Streamlit app
        working-directory: app
        run: snow streamlit deploy --replace

      - name: Attach Snowflake PyPI artifact repository (required for container runtime)
        run: |
          python - <<'EOF'
          import os, snowflake.connector
          conn = snowflake.connector.connect(
              account=os.environ["SNOWFLAKE_ACCOUNT"],
              user=os.environ["SNOWFLAKE_USER"],
              password=os.environ["SNOWFLAKE_PASSWORD"],
              role="ACCOUNTADMIN",
              warehouse=os.environ["SNOWFLAKE_WAREHOUSE"],
          )
          cur = conn.cursor()
          try:
              cur.execute("GRANT DATABASE ROLE SNOWFLAKE.PYPI_REPOSITORY_USER TO ROLE ACCOUNTADMIN")
          except Exception as e:
              print(f"Note: {e}")
          cur.execute("""
              ALTER STREAMLIT CUSTOMER_360.APP.CUSTOMER_360_APP
              SET ARTIFACT_REPOSITORIES = (snowflake.snowpark.pypi_shared_repository)
          """)
          conn.close()
          print("Artifact repository attached.")
          EOF
